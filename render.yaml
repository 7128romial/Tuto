services:
  - type: web
    name: annettes-private-lessons
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TEACHER_USERNAME
        value: annette
      - key: TEACHER_PASSWORD
        sync: false
